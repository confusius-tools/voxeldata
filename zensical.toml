[project]
site_name = "VoxelData"
site_description = "Spatially referenced voxel arrays built on xarray."
site_author = "The VoxelData developers"
copyright = "Copyright © 2026 The VoxelData developers"
docs_dir = "docs"
site_dir = "site"
extra_css = ["stylesheets/extra.css"]
nav = [
    { "Home" = "index.md" },
    { "API Reference" = [
        { "Geometry" = "api/geometry.md" },
        { "Creation" = "api/create.md" },
        { "Persistence" = "api/io.md" },
        { "Validation" = "api/validation.md" },
        { "Affine operations" = "api/affine.md" },
        { "Extraction" = "api/extract.md" },
        { "Masks and labels" = "api/masks.md" },
        { "Accessors" = "api/accessors.md" },
        { "Dimensions" = "api/dims.md" },
    ]},
]

[project.validation]
unresolved_references = false

[project.theme]
variant = "modern"
language = "en"
features = [
    "navigation.tabs",
    "navigation.sections",
    "navigation.expand",
    "navigation.path",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.tracking",
    "toc.follow",
    "search.highlight",
    "content.code.copy",
    "content.code.annotate",
    "content.tooltips",
    "content.footnote.tooltips",
    "content.action.copy",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[project.plugins.mkdocstrings.handlers.python]
inventories = [
    "https://docs.python.org/3/objects.inv",
    "https://numpy.org/doc/stable/objects.inv",
    "https://docs.xarray.dev/en/stable/objects.inv",
    "https://pandas.pydata.org/docs/objects.inv",
]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
docstring_section_style = "list"
members_order = "alphabetical"
separate_signature = true
show_source = false
filters = ["!^_"]
show_root_heading = true
show_root_toc_entry = true
show_root_full_path = false
show_object_full_path = false
show_category_heading = false
show_if_no_docstring = false
show_signature = true
show_signature_annotations = true
signature_crossrefs = true
annotations_path = "brief"
show_symbol_type_toc = true
inherited_members = true
parameter_headings = true
heading_level = 2
summary = true

[project.markdown_extensions.zensical.extensions.glightbox]
auto = true
auto_themed = true
auto_caption = true
skip_classes = ["hero-logo", "md-logo", "skip-lightbox"]

[project.markdown_extensions.admonition]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.abbr]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.pymdownx.keys]

[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.tilde]

[project.markdown_extensions.toc]
toc_depth = 3
permalink = true

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.footnotes]

[project.markdown_extensions.tables]

[project.markdown_extensions.def_list]

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
