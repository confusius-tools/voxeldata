name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  runtime:
    name: Runtime dependencies (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: base, package: ".", modules: ""}
          - {profile: lazy, package: ".[lazy]", modules: "dask"}
          - {profile: accel, package: ".[accel]", modules: "flox"}
          - {profile: io, package: ".[io]", modules: "zarr h5netcdf"}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.11"

      - name: Install package and pytest
        run: |
          uv venv
          uv pip install '${{ matrix.package }}' pytest

      - name: Check installed backends and run tests
        env:
          EXPECTED_MODULES: ${{ matrix.modules }}
        run: |
          .venv/bin/python - <<'PY'
          import os
          from importlib.util import find_spec

          installed = {m for m in ("dask", "flox", "zarr", "h5netcdf") if find_spec(m)}
          expected = set(os.environ["EXPECTED_MODULES"].split())
          assert installed == expected, (installed, expected)
          PY
          .venv/bin/python -m pytest -o addopts= tests/

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run pytest with coverage
        run: uv run --no-sync pytest tests/
