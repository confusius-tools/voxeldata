name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.11"

      - name: Install base package and pytest
        run: |
          uv venv
          uv pip install -e . pytest

      - name: Test without optional dependencies
        run: |
          .venv/bin/python -c "import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ('dask', 'flox', 'zarr', 'h5netcdf'))"
          .venv/bin/python -m pytest -o addopts= tests/test_create.py tests/test_extract_mask.py

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run pytest with coverage
        run: uv run --no-sync pytest tests/
